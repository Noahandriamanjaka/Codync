name: Release APK (signed)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release (unsigned)
        run: ./gradlew :app:assembleRelease
      - name: Sign with persistent keystore
        env:
          CODYNC_KEYSTORE_B64: ${{ secrets.CODYNC_RELEASE_KEYSTORE_B64 }}
          CODYNC_SIGNING_PASSWORD: ${{ secrets.CODYNC_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CODYNC_KEYSTORE_B64"
          test -n "$CODYNC_SIGNING_PASSWORD"
          printf '%s' "$CODYNC_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/codync-release.p12"
          chmod 600 "$RUNNER_TEMP/codync-release.p12"
          BT=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/codync-release.p12" --ks-type PKCS12 \
            --ks-key-alias codync \
            --ks-pass env:CODYNC_SIGNING_PASSWORD \
            --key-pass env:CODYNC_SIGNING_PASSWORD \
            --out app/build/outputs/apk/release/codync-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/codync-release-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: codync-release-apk
          path: apps/android/app/build/outputs/apk/release/codync-release-signed.apk
          if-no-files-found: error
